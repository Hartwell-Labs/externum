name: ghcr-diagnose

on:
  workflow_dispatch:

permissions: read-all

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Login with BOT_TOKEN
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.BOT_TOKEN }}

      - name: Probe fresh package
        run: |
          docker pull alpine:3.20
          docker tag alpine:3.20 ghcr.io/hartwell-labs/externum-probe:bot
          docker push ghcr.io/hartwell-labs/externum-probe:bot
