name: ghcr-cleanup

on:
  workflow_dispatch:

permissions: read-all

jobs:
  cleanup:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Delete probe package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X DELETE /orgs/Hartwell-Labs/packages/container/externum-probe && echo deleted || echo "delete denied"
